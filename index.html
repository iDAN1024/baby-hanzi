<!DOCTYPE html>
<!-- 宝宝识字乐园 · 本地存储版（localStorage 前缀 wb_shizi_），零外链单文件 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>宝宝识字乐园</title>
<style>
:root{
  --coral:#FF6B6B; --teal:#4ECDC4; --sun:#FFD93D; --grape:#9B5DE5; --leaf:#6BCB77;
  --ink:#3D3654; --soft:#8B85A3; --bg:#FFF7EC; --card:#FFFFFF; --red:#E63946;
  --shadow:0 4px 16px rgba(61,54,84,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(180deg,#FFF3DC 0%,#FFF7EC 40%,#F0FBF9 100%);
  color:var(--ink);min-height:100vh;padding-bottom:96px;
}
.kai{font-family:"Kaiti SC","STKaiti","KaiTi","Kaiti TC",serif}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.hidden{display:none!important}

/* ===== 头部 ===== */
header{
  position:sticky;top:0;z-index:50;background:rgba(255,247,236,.92);
  backdrop-filter:blur(8px);padding:10px 14px;display:flex;align-items:center;gap:8px;
  border-bottom:2px solid #FFE8C2;
}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.15rem}
.logo svg{width:30px;height:30px}
.head-spacer{flex:1}
.chip{
  display:flex;align-items:center;gap:5px;background:#fff;border:2px solid var(--sun);
  border-radius:999px;padding:6px 12px;font-weight:800;font-size:.95rem;color:#B8860B;
}
.chip svg{width:18px;height:18px}
.iconbtn{
  width:44px;height:44px;border-radius:14px;background:#fff;border:2px solid #FFE1B3;
  display:flex;align-items:center;justify-content:center;
}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink)}
main{max-width:960px;margin:0 auto;padding:14px}

/* ===== 今天要处理 ===== */
.today-card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:3px solid #FFE8C2}
.today-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;margin-bottom:10px}
.today-head svg{width:22px;height:22px}
.overdue-box{
  background:#FFF0F0;border:2px solid var(--red);border-radius:16px;padding:12px;
  display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;
}
.overdue-box .txt{flex:1;min-width:180px;color:var(--red);font-weight:700;font-size:.95rem}
.task-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.task-line .txt{flex:1;min-width:180px;font-weight:700;font-size:.95rem}
.progress{height:14px;border-radius:999px;background:#F1ECFF;overflow:hidden;flex:1;min-width:120px}
.progress>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--leaf));transition:width .4s}
.bigbtn{
  min-height:50px;padding:10px 20px;border-radius:16px;font-size:1.05rem;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--coral),#FF8E53);box-shadow:0 4px 0 #D94F4F;
}
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #D94F4F}
.bigbtn.teal{background:linear-gradient(135deg,var(--teal),#38B2A8);box-shadow:0 4px 0 #2C8F87}
.bigbtn.teal:active{box-shadow:0 1px 0 #2C8F87}
.bigbtn.grape{background:linear-gradient(135deg,var(--grape),#7C4BD6);box-shadow:0 4px 0 #653BB0}
.bigbtn.grape:active{box-shadow:0 1px 0 #653BB0}
.tip-bar{background:#FFF9E0;border:2px dashed var(--sun);border-radius:14px;padding:10px 12px;font-size:.88rem;font-weight:700;color:#8a6d00;margin-top:10px}

/* ===== 通用面板 ===== */
.panel{display:none;animation:fadein .25s}
.panel.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-title{display:flex;align-items:center;gap:8px;font-size:1.15rem;font-weight:800;margin:16px 0 10px}
.sec-title svg{width:24px;height:24px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px}

/* ===== 字卡 ===== */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.zi-card{perspective:800px;height:210px;position:relative}
.zi-inner{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.zi-card.flip .zi-inner{transform:rotateY(180deg)}
.zi-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;box-shadow:var(--shadow);padding:8px;
}
.zi-front{font-size:4rem;background:#fff;border:3px solid #FFE8C2}
.zi-back{transform:rotateY(180deg);background:#fff;border:3px solid var(--teal);font-size:.9rem}
.zi-back .pic svg{width:72px;height:72px}
.zi-back .py{font-size:1.1rem;font-weight:800;color:var(--grape)}
.zi-back .words{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.zi-back .words i{font-style:normal;background:#F0FBF9;border:1.5px solid var(--teal);border-radius:999px;padding:2px 8px;font-size:.78rem;font-weight:700;color:#2C8F87}
.minibtn{min-height:44px;min-width:44px;border-radius:12px;padding:8px 12px;font-weight:800;font-size:.9rem;color:#fff;background:var(--teal);display:inline-flex;align-items:center;gap:5px;justify-content:center}
.minibtn svg{width:18px;height:18px}
.minibtn.coral{background:var(--coral)}
.badge{position:absolute;top:8px;left:8px;z-index:3;font-size:.72rem;font-weight:800;border-radius:999px;padding:3px 9px;color:#fff}
.badge.review{background:var(--red)}
.badge.done{background:var(--leaf)}

/* ===== 组词练习 ===== */
.quiz-wrap{max-width:520px;margin:0 auto}
.quiz-q{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:22px 16px;text-align:center;border:3px solid #EDE4FF}
.quiz-char{font-size:4.4rem;line-height:1.1}
.quiz-tip{font-size:1.1rem;font-weight:800;margin:10px 0 4px;color:var(--soft)}
.quiz-ask{font-size:1.25rem;font-weight:800;margin-bottom:14px}
.opt-list{display:flex;flex-direction:column;gap:12px}
.opt-btn{
  min-height:56px;border-radius:18px;border:3px solid #E5DEFF;background:#FBFAFF;
  font-size:1.35rem;font-weight:800;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;
}
.opt-btn.right{background:#E9FBEF;border-color:var(--leaf);color:#2E7D32;animation:pop .35s}
.opt-btn.wrong{background:#FFF0F0;border-color:var(--red);color:var(--red);animation:shake .35s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-weight:800;color:var(--soft)}
.empty-box{text-align:center;padding:36px 16px;color:var(--soft);font-weight:700}

/* ===== 闯关 / 商城 ===== */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat-box{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:12px;text-align:center}
.stat-box .num{font-size:1.5rem;font-weight:800}
.stat-box .lbl{font-size:.8rem;color:var(--soft);font-weight:700;margin-top:2px}
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.level-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:14px;text-align:center;border:3px solid #E7FBF4}
.level-card.locked{opacity:.55;border-color:#EEE}
.level-card h4{font-size:1.05rem;margin-bottom:4px}
.level-card .chars{font-size:.8rem;color:var(--soft);font-weight:700;margin-bottom:8px}
.stars{display:flex;justify-content:center;gap:4px;margin-bottom:6px}
.stars svg{width:26px;height:26px}
.level-tag{font-size:.8rem;font-weight:800;border-radius:999px;padding:3px 12px;display:inline-block}
.level-tag.go{background:#E9FBEF;color:#2E7D32}
.level-tag.ing{background:#FFF6DC;color:#B8860B}
.level-tag.lock{background:#F1F1F4;color:#8B85A3}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.reward-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:14px;text-align:center;border:3px solid #FFF0D2}
.reward-card .rw-ico svg{width:40px;height:40px}
.reward-card h4{font-size:1rem;margin:6px 0 2px}
.reward-card .cost{font-weight:800;color:#B8860B;margin-bottom:8px}
.reward-card .pending-tag{font-size:.8rem;font-weight:800;color:var(--grape);background:#F3EDFF;border-radius:999px;padding:4px 10px;display:inline-block}

/* ===== 家长中心 ===== */
.lock-box{max-width:360px;margin:40px auto;text-align:center}
.lock-box .lock-ico svg{width:64px;height:64px}
.pass-input{
  width:100%;font-size:1.6rem;letter-spacing:12px;text-align:center;padding:14px;margin:14px 0;
  border:3px solid #EDE4FF;border-radius:16px;font-weight:800;
}
.report-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.chart-box{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.chart-box svg{width:100%;height:auto}
.admin-list{display:flex;flex-direction:column;gap:8px}
.admin-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.admin-item .t{flex:1;font-weight:700;font-size:.95rem}
.smbtn{min-height:44px;border-radius:12px;padding:8px 14px;font-weight:800;font-size:.88rem;color:#fff;background:var(--teal)}
.smbtn.red{background:var(--red)}
.smbtn.grape{background:var(--grape)}
.smbtn.gray{background:#A9A3C0}
.form-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.form-row input,.form-row select{
  font-size:16px;padding:12px;border-radius:14px;border:2.5px solid #EDE4FF;min-height:50px;font-weight:700;color:var(--ink);background:#fff;
}
.form-row input{flex:2;min-width:130px}
.form-row select{flex:1;min-width:100px}
.danger-zone{border:2.5px dashed var(--red);border-radius:18px;padding:12px;margin-top:14px}

/* ===== 底部导航 ===== */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;
  display:flex;border-top:2px solid #FFE8C2;padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:.78rem;font-weight:800;color:var(--soft);
}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--coral)}
nav button.on svg{stroke:var(--coral)}
@media (min-width:768px){
  body{padding-bottom:20px}
  nav{position:sticky;top:64px;bottom:auto;max-width:960px;margin:0 auto;border:2px solid #FFE8C2;border-radius:0 0 20px 20px}
}

/* ===== 弹层 ===== */
.overlay{position:fixed;inset:0;background:rgba(61,54,84,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:24px;padding:22px;max-width:400px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.modal h3{font-size:1.15rem;margin-bottom:10px}
.modal p{color:var(--soft);font-weight:700;margin-bottom:14px;font-size:.95rem}
.modal .row{display:flex;gap:10px;justify-content:center}
.toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;background:var(--ink);color:#fff;
  border-radius:999px;padding:10px 22px;font-weight:800;font-size:.95rem;box-shadow:var(--shadow);
  animation:fadein .2s;max-width:88vw;text-align:center;
}
.confetti{position:fixed;top:-10px;z-index:98;width:10px;height:16px;border-radius:3px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}

/* ===== 今日提示条 / 欢迎 / 奖杯庆祝 ===== */
.tip-bar.teal{background:#EAFBF9;border-color:var(--teal);color:#1F7A72;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tip-bar .tt{flex:1;min-width:160px;line-height:1.4}
.modal input{
  width:100%;min-height:54px;font-size:1.05rem;font-weight:800;text-align:center;
  border:3px solid #FFE1B3;border-radius:16px;padding:8px 14px;margin-bottom:14px;
  color:var(--ink);background:#FFFDF7;outline:none;font-family:inherit;
}
.modal input:focus{border-color:var(--teal)}
.welcome-pop{margin-bottom:4px;animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.trophy-pop{position:relative;width:132px;height:132px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center}
.trophy-pop .trophy-svg{
  width:86px;height:86px;position:relative;z-index:2;
  animation:trophyIn .75s cubic-bezier(.2,1.5,.4,1), trophyGlow 1.6s ease-in-out .75s infinite;
}
.trophy-pop .rays{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#FFE9A8 0%,rgba(255,233,168,0) 68%);animation:spin 6s linear infinite}
.trophy-pop::after{content:'';position:absolute;inset:14px;border:3px dashed #FFD93D;border-radius:50%;animation:spin 9s linear infinite reverse}
@keyframes trophyIn{0%{transform:scale(.3) rotate(-18deg);opacity:0}55%{transform:scale(1.18) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes trophyGlow{0%,100%{filter:drop-shadow(0 0 2px #FFD93D)}50%{filter:drop-shadow(0 0 14px #FFC107)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.trophy-pop .rays,.trophy-pop::after{animation:none}}
</style>
</head>

<header>
  <div class="logo"><svg><use href="#i-logo"/></svg><span id="appTitle">宝宝识字乐园</span></div>
  <div class="head-spacer"></div>
  <div class="chip" title="我的积分"><svg><use href="#i-coin"/></svg><span id="pointsChip">0</span></div>
  <button class="iconbtn" id="btnExport" title="导出备份"><svg><use href="#i-down"/></svg></button>
  <button class="iconbtn" id="btnImport" title="导入恢复"><svg><use href="#i-up"/></svg></button>
  <input type="file" id="importFile" accept=".json" class="hidden">
</header>

<main>
  <!-- 今天要处理 -->
  <section class="today-card" id="todaySection"></section>

  <!-- 模块面板 -->
  <section class="panel" id="panel-cards"></section>
  <section class="panel" id="panel-quiz"></section>
  <section class="panel" id="panel-levels"></section>
  <section class="panel" id="panel-parent"></section>
</main>

<nav>
  <button data-tab="cards" class="on"><svg><use href="#i-cards"/></svg>学字卡片</button>
  <button data-tab="quiz"><svg><use href="#i-quiz"/></svg>组词练习</button>
  <button data-tab="levels"><svg><use href="#i-trophy"/></svg>闯关奖励</button>

<script>
(function(){
'use strict';

/* ================= 数据层 ================= */
var LS_PREFIX='wb_shizi_';
function lsGet(k,fb){try{var v=localStorage.getItem(LS_PREFIX+k);return v?JSON.parse(v):fb;}catch(e){return fb;}}
function lsSet(k,v){try{localStorage.setItem(LS_PREFIX+k,JSON.stringify(v));}catch(e){}}

function pad(n){return n<10?'0'+n:''+n;}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return fmtDate(new Date());}
function dayOffsetStr(off){var d=new Date();d.setDate(d.getDate()+off);return fmtDate(d);}

/* 字库：60 字 × 3 关，每字含拼音/组词/象形插画（内联 SVG） */
var BANK=[
{c:'日',p:'rì',w:['日子','太阳','生日'],s:'<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="13" fill="#FFD93D" stroke="#F0A500" stroke-width="3"/><g stroke="#F0A500" stroke-width="3" stroke-linecap="round"><path d="M32 6v7M32 51v7M6 32h7M51 32h7M13 13l5 5M46 46l5 5M51 13l-5 5M18 46l-5 5"/></g></svg>'},
{c:'月',p:'yuè',w:['月亮','月光','明月'],s:'<svg viewBox="0 0 64 64"><path d="M42 8a26 26 0 1 0 0 48 21 21 0 1 1 0-48z" fill="#FFE28A" stroke="#E8B90B" stroke-width="3" stroke-linejoin="round"/></svg>'},

/* ================= 状态 ================= */
function defaultRewards(){
  return [
    {id:'rw1',name:'贴纸一张',cost:20},
    {id:'rw2',name:'小零食一份',cost:30},
    {id:'rw3',name:'看动画片20分钟',cost:50},
    {id:'rw4',name:'周末去公园玩',cost:120}
  ];
}
function freshState(){
  return {
    v:2, currentDay:1, points:0, streak:0, lastActive:null,
    chars:{}, log:{}, rewards:defaultRewards(), redemptions:[],
    settings:{daily:20,pass:null,name:''}, sample:false, parentUnlocked:false,
    onboarded:false, celebrated:null
  };
}
function sampleState(){
  var st=freshState(); st.sample=true; st.currentDay=2; st.points=32; st.streak=1; st.lastActive=dayOffsetStr(-1);
  for(var i=0;i<DAY_SIZE;i++){
    var c=BANK[i].c;
    st.chars[c]={st:(i<15?2:1), day:1};
  }
  st.log[dayOffsetStr(-1)]=15;
  st.redemptions.push({id:'rd_sample',rewardName:'贴纸一张',cost:20,status:'pending',ts:Date.now()-86400000});
  return st;
}
var state=lsGet('state',null);
if(!state){ state=freshState(); lsSet('state',state); }
/* 老版本存档补齐新字段，保证向后兼容 */
if(!state.settings) state.settings={daily:20,pass:null,name:''};
if(typeof state.settings.name!=='string') state.settings.name='';
if(typeof state.onboarded!=='boolean') state.onboarded=false;
if(typeof state.celebrated!=='string') state.celebrated=null;
lsSet('state',state); /* 补齐后立刻落盘，保证老存档迁移不丢 */
function save(){ lsSet('state',state); }
function babyName(){ return (state.settings && state.settings.name) ? state.settings.name : '宝宝'; }

/* ================= 计算层 ================= */
function dayChars(d){ return BANK.slice((d-1)*DAY_SIZE, d*DAY_SIZE); }
function charSt(c){ var r=state.chars[c]; return r?r.st:0; }
function isOverdueChar(idx){
  var day=Math.floor(idx/DAY_SIZE)+1;
  return day<state.currentDay && charSt(BANK[idx].c)<2;
}
function overdueList(){
  var out=[];
  for(var i=0;i<(state.currentDay-1)*DAY_SIZE && i<BANK.length;i++){
    if(charSt(BANK[i].c)<2) out.push(i);
  }
  return out;
}
function todayTarget(){ return Math.min(state.settings.daily||20, DAY_SIZE); }
function todayProgress(){
  var chars=dayChars(state.currentDay), mastered=0;
  for(var i=0;i<chars.length;i++) if(charSt(chars[i].c)===2) mastered++;
  return {total:chars.length, mastered:mastered, target:Math.min(todayTarget(),chars.length)};
}
function totalMastered(){
  var n=0; for(var k in state.chars){ if(state.chars[k].st===2) n++; } return n;
}
function markSeen(c){
  var r=state.chars[c]||{st:0,day:state.currentDay};
  if(r.st===0){ r.st=1; state.points+=1; }
  state.chars[c]=r; touchActive();
}
function markMastered(c){
  var r=state.chars[c]||{st:0,day:state.currentDay};
  var was=r.st;
  if(was<2){ r.st=2; state.points+=2; state.chars[c]=r;
    var t=todayStr(); state.log[t]=(state.log[t]||0)+1; touchActive();
    /* 先用「未解锁下一关前」的进度判断今日目标，再判断是否通关，避免进度被重置导致漏庆祝 */
    var tp=todayProgress();
    checkTodayGoal(tp);
    checkDayClear();
  }
}
/* 今日目标达成检测：每天只庆祝一次 */
function checkTodayGoal(tp){
  tp = tp || todayProgress();
  if(state.celebrated===todayStr()) return;
  if(!tp || !(tp.target>0) || !(tp.mastered>=tp.target)) return;
  state.celebrated=todayStr(); save();
  setTimeout(function(){ celebrate(tp.mastered); },320);
}
/* 奖杯 + 撒花庆祝动效 */
function celebrate(n){
  var name=babyName();
  showModal('<div class="trophy-pop">'
    +'<div class="rays"></div>'
    +'<svg class="trophy-svg" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 5H4a4 4 0 0 0 4 4M16 5h4a4 4 0 0 1-4 4M12 13v4M8 21h8M10 17h4" fill="#FFD93D" stroke="#E0A800" stroke-width="1.6" stroke-linecap="round"/></svg>'
    +'</div>'
    +'<h3>今日目标完成！</h3>'
    +'<p>'+esc(name)+'今天学会了 <b style="color:#2E7D32">'+n+'</b> 个字，太棒啦！</p>'
    +'<div class="row"><button class="bigbtn teal" id="celOk">好耶！</button></div>');
  confetti();
  setTimeout(confetti,450);
  setTimeout(confetti,950);
  speak(name+'太棒了，今天的目标完成啦');
  el('celOk').addEventListener('click',function(){ closeModal(); });
}
function touchActive(){
  var t=todayStr();
  if(state.lastActive!==t){
    state.streak=(state.lastActive===dayOffsetStr(-1))?state.streak+1:1;
    state.lastActive=t;
  }
}
function checkDayClear(){
  var chars=dayChars(state.currentDay), all=true;
  for(var i=0;i<chars.length;i++) if(charSt(chars[i].c)<2){ all=false; break; }
  if(all && chars.length){
    state.points+=20;
    if(state.currentDay<TOTAL_DAYS){
      state.currentDay++;
      setTimeout(function(){ toast('太棒了！通关成功 +20分，解锁第 '+state.currentDay+' 关！'); confetti(); },300);
    }else{
      setTimeout(function(){ toast('恭喜！全部 '+BANK.length+' 个字都学会啦！'); confetti(); },300);
    }
  }
}

/* ================= 语音 ================= */
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=0.75; u.pitch=1.1;

function toast(msg){

function confetti(){

var quizState={char:null,options:[],answered:false};
function pickQuizChar(){
  if(state.currentDay>TOTAL_DAYS) return null;
  var start=(state.currentDay-1)*DAY_SIZE, pool=[];
  for(var i=start;i<start+DAY_SIZE && i<BANK.length;i++){
    if(charSt(BANK[i].c)===1) pool.push(BANK[i]); // 已翻卡但未掌握
  }
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
function buildOptions(target){
  var correct=target.w[Math.floor(Math.random()*target.w.length)];
  var distract=[];
  var guard=0;
  while(distract.length<2 && guard<200){
    guard++;
    var item=BANK[Math.floor(Math.random()*BANK.length)];
    if(item.c===target.c) continue;
    var w=item.w[Math.floor(Math.random()*item.w.length)];
    if(w.indexOf(target.c)!==-1) continue;
    if(distract.indexOf(w)!==-1 || w===correct) continue;
    distract.push(w);
  }
  var opts=[{w:correct,ok:true}];
  for(var i=0;i<distract.length;i++) opts.push({w:distract[i],ok:false});
  // 洗牌
  for(var j=opts.length-1;j>0;j--){
    var r=Math.floor(Math.random()*(j+1)),tmp=opts[j];opts[j]=opts[r];opts[r]=tmp;
  }
  return opts;
}
function renderQuiz(){
  var panel=el('panel-quiz');
  if(state.currentDay>TOTAL_DAYS){
    panel.innerHTML='<div class="empty-box">全部字都学完啦，没有新的练习了，去闯关领奖吧！</div>';
    return;
  }
  if(!quizState.char || charSt(quizState.char.c)===2){
    var next=pickQuizChar();
    if(!next){
      var hasUnflipped=false, start=(state.currentDay-1)*DAY_SIZE;
      for(var i=start;i<start+DAY_SIZE && i<BANK.length;i++){ if(charSt(BANK[i].c)===0){hasUnflipped=true;break;} }
      if(hasUnflipped){
        panel.innerHTML='<div class="empty-box">先去「学字卡片」把字卡翻一翻，<br>学过之后再来做组词练习哦<br><br><button class="bigbtn teal" id="quizGoCards">去学字卡片</button></div>';
        el('quizGoCards').addEventListener('click',function(){ switchTab('cards'); });
      }else{
        panel.innerHTML='<div class="empty-box">本关的字全部掌握啦！去「闯关奖励」看看吧<br><br><button class="bigbtn grape" id="quizGoLevels">去闯关</button></div>';
        el('quizGoLevels').addEventListener('click',function(){ switchTab('levels'); });
      }
      return;
    }
    quizState={char:next,options:buildOptions(next),answered:false};
  }
  var q=quizState;
  var h='<div class="sec-title"><svg viewBox="0 0 24 24" fill="none" stroke="#9B5DE5" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>组词练习 · 答对就掌握这个字，+2分</div>';
  h+='<div class="quiz-wrap"><div class="quiz-q">'
    +'<div class="quiz-char kai">'+esc(q.char.c)+'</div>'
    +'<div class="quiz-tip">'+esc(q.char.p)+' · '+speakerBtn(q.char.c)+'</div>'
    +'<div class="quiz-ask">哪个词语里有「'+esc(q.char.c)+'」字？</div>'
    +'<div class="opt-list">';
  for(var i=0;i<q.options.length;i++){
    h+='<button class="opt-btn" data-ok="'+(q.options[i].ok?1:0)+'" data-w="'+esc(q.options[i].w)+'">'+esc(q.options[i].w)+'</button>';
  }
  h+='</div><div class="quiz-foot"><span>不会就点「听一听」让字宝宝说话</span><span>当前积分 '+state.points+'</span></div></div></div>';
  panel.innerHTML=h;

  var opts=panel.querySelectorAll('.opt-btn');
  for(var k=0;k<opts.length;k++){
    (function(btn){
      btn.addEventListener('click',function(){
        var w=btn.getAttribute('data-w');
        speak(w);
        if(btn.getAttribute('data-ok')==='1'){
          if(quizState.answered) return;
          quizState.answered=true;
          btn.classList.add('right');
          markMastered(quizState.char.c);
          save();
          toast('答对啦！「'+quizState.char.c+'」掌握了 +2分');
          setTimeout(function(){ quizState.char=null; refreshAll(); },1200);
        }else{
          btn.classList.add('wrong');
          setTimeout(function(){ btn.classList.remove('wrong'); },500);
        }
      });
    })(opts[k]);
  }
}

  // 学习报告
  h+='<div class="report-grid">'
    +'<div class="stat-box"><div class="num" style="color:#2E7D32">'+mastered+' / '+BANK.length+'</div><div class="lbl">累计学会</div></div>'
    +'<div class="stat-box"><div class="num" style="color:#B8860B">'+state.points+'</div><div class="lbl">当前积分</div></div>'
    +'<div class="stat-box"><div class="num" style="color:#D94F4F">'+state.streak+'</div><div class="lbl">连续学习(天)</div></div>'
    +'<div class="stat-box"><div class="num" style="color:#2A6F97">第 '+Math.min(state.currentDay,TOTAL_DAYS)+' 关</div><div class="lbl">当前进度</div></div>'
    +'</div>';

  // 最近7天柱状图（内联 SVG）
  var days=[],max=1;
  for(var i=6;i>=0;i--){
    var ds=dayOffsetStr(-i), n=state.log[ds]||0;
    days.push({d:ds.slice(5),n:n}); if(n>max)max=n;
  }
  var bw=36,gap=18,chartW=days.length*(bw+gap)+gap,chartH=140;
  var svgBars='';
  for(var b=0;b<days.length;b++){
    var bh=Math.max(4,Math.round(days[b].n/max*100));
    var x=gap+b*(bw+gap), y=chartH-24-bh;
    var fill=b===days.length-1?'#FF6B6B':'#4ECDC4';
    svgBars+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="7" fill="'+fill+'"/>'
      +'<text x="'+(x+bw/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="11" font-weight="bold" fill="#3D3654">'+days[b].n+'</text>'
      +'<text x="'+(x+bw/2)+'" y="'+(chartH-8)+'" text-anchor="middle" font-size="10" fill="#8B85A3">'+days[b].d+'</text>';
  }
  h+='<div class="chart-box"><div style="font-weight:800;margin-bottom:8px">最近 7 天掌握字数</div>'
    +'<svg viewBox="0 0 '+chartW+' '+chartH+'">'+svgBars+'</svg></div>';

  // 待确认兑换
  h+='<div class="sec-title"><svg viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6M10 19a2 2 0 0 0 4 0"/></svg>待确认兑换</div>';
  var pendings=[];
  for(var p=0;p<state.redemptions.length;p++) if(state.redemptions[p].status==='pending') pendings.push(state.redemptions[p]);
  if(!pendings.length){
    h+='<div class="admin-list"><div class="admin-item"><span class="t" style="color:var(--soft)">暂无待确认的兑换申请</span></div></div>';
  }else{
    h+='<div class="admin-list">';
    for(var q=0;q<pendings.length;q++){
      h+='<div class="admin-item"><span class="t">'+esc(pendings[q].rewardName)+'（'+pendings[q].cost+' 积分）</span>'
        +'<button class="smbtn" data-confirm="'+pendings[q].id+'">确认兑现</button>'
        +'<button class="smbtn gray" data-refund="'+pendings[q].id+'">取消退分</button></div>';
    }
    h+='</div>';
  }

  // 奖励管理
  h+='<div class="sec-title"><svg viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M12 9v11M4 13h16"/></svg>奖励管理</div>';
  h+='<div class="admin-list">';
  for(var r=0;r<state.rewards.length;r++){
    h+='<div class="admin-item"><span class="t">'+esc(state.rewards[r].name)+'（'+state.rewards[r].cost+' 积分）</span>'
      +'<button class="smbtn red" data-delreward="'+state.rewards[r].id+'">删除</button></div>';
  }
  h+='</div>';
  h+='<div class="form-row"><input id="rwName" placeholder="新奖励名称，如：去动物园" maxlength="12">'
    +'<input id="rwCost" type="number" inputmode="numeric" placeholder="积分" min="1" max="999" style="max-width:100px">'
    +'<button class="smbtn grape" id="btnAddReward" style="min-height:50px">添加</button></div>';

  // 设置与数据
  h+='<div class="sec-title"><svg viewBox="0 0 24 24" fill="none" stroke="#3D3654" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2L10 21h4l.6-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>设置与数据</div>';
  h+='<div class="form-row"><span style="font-weight:800;align-self:center">宝宝昵称</span>'
    +'<input id="inpName" maxlength="8" value="'+esc(state.settings.name||'')+'" placeholder="如：豆豆" style="max-width:160px">'
    +'<button class="smbtn" id="btnSaveName" style="min-height:50px">保存</button></div>';
  h+='<div class="form-row"><span style="font-weight:800;align-self:center">每日学字目标</span>'
    +'<select id="selDaily">'
    +[10,15,20,25].map(function(n){ return '<option value="'+n+'"'+(todayTarget()===n?' selected':'')+'>'+n+' 个字</option>'; }).join('')
    +'</select></div>';
  h+='<div class="form-row"><span style="font-weight:800;align-self:center">跳到指定关卡</span>'
    +'<input id="inpJump" type="number" inputmode="numeric" min="1" max="'+TOTAL_DAYS+'" placeholder="1~'+TOTAL_DAYS+'" style="max-width:120px">'
    +'<button class="smbtn grape" id="btnJump" style="min-height:50px">跳转</button></div>';
  h+='<div class="form-row">'
    +'<button class="smbtn" id="btnExport2" style="min-height:50px;flex:1">导出 JSON 备份</button>'
    +'<button class="smbtn grape" id="btnImport2" style="min-height:50px;flex:1">导入恢复</button>'
    +'<button class="smbtn gray" id="btnResetPass" style="min-height:50px;flex:1">重设密码</button>'
    +'</div>';
  h+='<div class="danger-zone"><div style="font-weight:800;color:var(--red);margin-bottom:8px">数据管理（谨慎操作）</div>'
    +'<div class="form-row" style="margin-top:0">'
    +(state.sample?'<button class="smbtn gray" id="btnClearSample" style="min-height:50px;flex:1">清空示例数据</button>'
                  :'<button class="smbtn gray" id="btnLoadSample" style="min-height:50px;flex:1">载入示例数据</button>')
    +'<button class="smbtn red" id="btnClearAll" style="min-height:50px;flex:1">清空全部数据</button>'
    +'</div></div>';
  h+='<div style="text-align:center;margin-top:14px"><button class="smbtn gray" id="btnLock">退出家长中心</button></div>';

  panel.innerHTML=h;

  // 事件绑定
  var cbs=panel.querySelectorAll('[data-confirm]');
  for(var c1=0;c1<cbs.length;c1++){
    (function(btn){ btn.addEventListener('click',function(){
      var id=btn.getAttribute('data-confirm');
      for(var i=0;i<state.redemptions.length;i++){
        if(state.redemptions[i].id===id){ state.redemptions[i].status='done'; break; }
      }
      save(); refreshAll(); toast('已确认兑现，宝宝真棒！');
    }); })(cbs[c1]);
  }
  var rbs=panel.querySelectorAll('[data-refund]');
  for(var c2=0;c2<rbs.length;c2++){
    (function(btn){ btn.addEventListener('click',function(){
      var id=btn.getAttribute('data-refund');
      for(var i=0;i<state.redemptions.length;i++){
        if(state.redemptions[i].id===id){
          state.points+=state.redemptions[i].cost;
          state.redemptions.splice(i,1); break;
        }
      }
      save(); refreshAll(); toast('已取消并退回积分');
    }); })(rbs[c2]);
  }
  var dbs=panel.querySelectorAll('[data-delreward]');
  for(var c3=0;c3<dbs.length;c3++){
    (function(btn){ btn.addEventListener('click',function(){
      var id=btn.getAttribute('data-delreward');
      for(var i=0;i<state.rewards.length;i++){
        if(state.rewards[i].id===id){ state.rewards.splice(i,1); break; }
      }
      save(); refreshAll(); toast('奖励已删除');
    }); })(dbs[c3]);
  }
  el('btnAddReward').addEventListener('click',function(){
    var name=el('rwName').value.trim(), cost=parseInt(el('rwCost').value,10);
    if(!name){ toast('请输入奖励名称'); return; }
    if(!cost||cost<1){ toast('请输入需要的积分'); return; }
    state.rewards.push({id:'rw_'+Date.now(),name:name,cost:cost});
    save(); refreshAll(); toast('新奖励已上架');
  });
  el('btnSaveName').addEventListener('click',function(){
    var v=(el('inpName').value||'').trim().slice(0,8);
    state.settings.name=v||'宝宝'; save(); refreshAll(); toast('昵称已更新：'+state.settings.name);
  });
  el('selDaily').addEventListener('change',function(){
    state.settings.daily=parseInt(this.value,10); save(); refreshAll(); toast('每日目标已更新');
  });
  el('btnJump').addEventListener('click',function(){
    var n=parseInt(el('inpJump').value,10);
    if(!n||n<1||n>TOTAL_DAYS){ toast('请输入 1~'+TOTAL_DAYS+' 之间的关号'); return; }
    state.currentDay=n; save(); refreshAll(); toast('已跳到第 '+n+' 关');
  });
  var ls2=el('btnLoadSample');
  if(ls2) ls2.addEventListener('click',function(){
    var keepPass=state.settings.pass, keepDaily=state.settings.daily, keepName=state.settings.name, keepRewards=state.rewards;
    state=sampleState();
    state.settings.pass=keepPass; state.settings.daily=keepDaily; state.settings.name=keepName;
    if(keepRewards && keepRewards.length) state.rewards=keepRewards;
    state.parentUnlocked=true; state.onboarded=true;
    save(); refreshAll(); toast('示例数据已载入，方便先看看效果');
  });
  el('btnExport2').addEventListener('click',exportJson);
  el('btnImport2').addEventListener('click',function(){ el('importFile').click(); });
  el('btnResetPass').addEventListener('click',function(){
    state.settings.pass=null; save();
    askPassword(function(){ toast('新密码已设置'); refreshAll(); });
  });
  var cs=el('btnClearSample');
  if(cs) cs.addEventListener('click',function(){
    showModal('<h3>清空示例数据？</h3><p>将重置学习进度，从第 1 关重新开始（保留奖励和密码）</p>'
      +'<div class="row"><button class="bigbtn" id="cfYes">确认清空</button><button class="bigbtn teal" id="cfNo">再想想</button></div>');
    el('cfYes').addEventListener('click',function(){
      var keepPass=state.settings.pass, keepDaily=state.settings.daily, keepRewards=state.rewards, keepName=state.settings.name;
      state=freshState(); state.settings.pass=keepPass; state.settings.daily=keepDaily; state.settings.name=keepName;
      state.rewards=keepRewards; state.parentUnlocked=true; state.onboarded=true;
      save(); closeModal(); refreshAll(); toast('已清空示例数据，从第 1 关重新开始');
    });
    el('cfNo').addEventListener('click',closeModal);
  });
  el('btnClearAll').addEventListener('click',function(){
    showModal('<h3>确定清空全部数据？</h3><p>学习进度、积分、奖励、密码都会被删除，且无法恢复！建议先导出备份。</p>'
      +'<div class="row"><button class="bigbtn" id="caYes">我已了解，确认清空</button><button class="bigbtn teal" id="caNo">取消</button></div>');
    el('caYes').addEventListener('click',function(){
      state=freshState(); save(); closeModal(); refreshAll(); showOnboarding();
    });
    el('caNo').addEventListener('click',closeModal);
  });
  el('btnLock').addEventListener('click',function(){
    state.parentUnlocked=false; switchTab('cards'); refreshAll();
  });
}

function refreshAll(){
  renderPointsChip();
  renderTitle();
  renderToday();
  renderCards();
  renderQuiz();
  renderLevels();
  renderParent();
}

/* ================= 路由 ================= */
function switchTab(tab){
  var btns=document.querySelectorAll('nav button');
  for(var i=0;i<btns.length;i++) btns[i].classList.toggle('on',btns[i].getAttribute('data-tab')===tab);
  var panels=document.querySelectorAll('.panel');
  for(var j=0;j<panels.length;j++) panels[j].classList.remove('active');
  el('panel-'+tab).classList.add('active');
  window.scrollTo(0,0);
}

/* ================= 备份 ================= */
function exportJson(){
  var data=JSON.stringify(state,null,2);
  var blob=new Blob([data],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='宝宝识字乐园_备份_'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('备份文件已下载');
}
function importJson(file){
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(String(reader.result));
      if(!data||typeof data!=='object'||!data.settings) throw new Error('bad');
      state=data; save(); refreshAll(); toast('恢复成功！');
    }catch(e){ toast('文件格式不对，恢复失败'); }
  };
  reader.readAsText(file);
}

/* ================= 初始化 ================= */
function init(){
  var navBtns=document.querySelectorAll('nav button');
  for(var i=0;i<navBtns.length;i++){
    navBtns[i].addEventListener('click',function(){ switchTab(this.getAttribute('data-tab')); });
  }
  el('btnExport').addEventListener('click',exportJson);
  el('btnImport').addEventListener('click',function(){ el('importFile').click(); });
  el('importFile').addEventListener('change',function(){ if(this.files&&this.files[0]) importJson(this.files[0]); this.value=''; });
  switchTab('cards');
  refreshAll();
  if(!state.onboarded){ showOnboarding(); }
}
document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
</html>
